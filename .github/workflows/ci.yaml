name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron:  '45 4 * * *'

permissions:
  contents: read

jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        ruby: ['2.7']
    # ruby/setup-ruby has no Ruby < 3.2 for ubuntu-26.04, which ubuntu-latest now points to
    runs-on: ${{ matrix.os == 'ubuntu' && 'ubuntu-24.04' || format('{0}-latest', matrix.os) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 2
      - run: bundle exec rake

  rubocop:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 2
      - run: bundle exec rubocop

  rubies:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4', '4.0', 'ruby-head', 'debug', 'truffleruby', 'truffleruby-head']
    # ruby/setup-ruby has no Ruby < 3.2 for ubuntu-26.04, which ubuntu-latest now points to
    runs-on: ${{ contains(fromJSON('["3.0", "3.1"]'), matrix.ruby) && 'ubuntu-24.04' || format('{0}-latest', matrix.os) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 2
      - run: bundle exec rake

  psych4:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        ruby: ['3.3']
    runs-on: ${{ matrix.os }}-latest
    env:
      PSYCH_4: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 2
      - run: bundle exec rake

  minimal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        ruby: ['jruby']
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 2
      - run: bin/test-minimal-support
